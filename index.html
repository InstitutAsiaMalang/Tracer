<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracer Study — Institut Asia Malang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .slide-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-16">

  <!-- Header Banner -->
  <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white py-10 px-4 shadow-sm">
    <div class="max-w-2xl mx-auto text-center">
      <span class="inline-block px-3 py-1 bg-white/10 rounded-full text-xs font-semibold tracking-wider uppercase mb-3">Kuesioner Resmi</span>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Tracer Study Mahasiswa</h1>
      <p class="text-blue-100 text-sm sm:text-base mt-2">Bantu kami meningkatkan kualitas akademik dan layanan dengan mengisi survei ini.</p>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 -mt-4">
    <!-- State Loading -->
    <div id="loading" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8 text-center">
      <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-slate-500 text-sm font-medium">Memuat daftar pertanyaan...</p>
    </div>

    <!-- Form Utama -->
    <form id="tracerForm" class="hidden space-y-5" onsubmit="handleSubmit(event)">
      <div id="questionContainer" class="space-y-5"></div>

      <!-- Tombol Submit -->
      <div class="pt-4">
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition duration-150 flex items-center justify-center gap-2">
          <span>Kirim Jawaban</span>
        </button>
      </div>
    </form>

    <!-- Modal Status Sukses -->
    <div id="successModal" class="hidden bg-white rounded-2xl shadow-lg border border-slate-200/80 p-8 text-center my-8 slide-in">
      <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">Terima Kasih!</h2>
      <p class="text-slate-600 text-sm mb-6">Data survei kamu berhasil disimpan.</p>
      <button onclick="window.location.reload()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition">Isi Form Lagi</button>
    </div>
  </main>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwke-xlaq2SSnRLrqjoElvLoRAlzt6KR7RcVFVf5_qIVkUPcdHYf1pLAfu-bz9F1WEuSQ/exec';
    
    let questionsData = [];
    let followupsData = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getQuestions`);
        const json = await res.json();
        if (json.ok) {
          questionsData = json.questions;
          followupsData = json.followups || {};
          renderAllQuestions();
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('tracerForm').classList.remove('hidden');
        } else {
          showError('Gagal memuat soal: ' + json.error);
        }
      } catch (err) {
        showError('Gagal tersambung ke server. Pastikan Web App terbuka publik.');
      }
    });

    function showError(msg) {
      document.getElementById('loading').innerHTML = `
        <div class="text-rose-500 font-semibold mb-2">Terjadi Kesalahan</div>
        <div class="text-slate-500 text-sm mb-4">${msg}</div>
        <button onclick="window.location.reload()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg">Coba Lagi</button>
      `;
    }

    function renderAllQuestions() {
      const container = document.getElementById('questionContainer');
      container.innerHTML = '';

      questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80';
        card.id = `card-q-${q.no}`;

        const reqBadge = q.required 
          ? '<span class="text-rose-500 font-bold ml-0.5">*</span>' 
          : '<span class="text-slate-400 text-xs font-normal ml-1">(opsional)</span>';

        let inputHtml = '';

        if (q.type === 'text' || q.type === 'tel') {
          inputHtml = `
            <input type="${q.type}" name="q_${q.no}" ${q.required ? 'required' : ''} 
              class="w-full mt-3 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm placeholder-slate-400" 
              placeholder="Ketik jawabanmu di sini..." />
          `;
        } else if (q.type === 'textarea') {
          inputHtml = `
            <textarea name="q_${q.no}" rows="3" ${q.required ? 'required' : ''}
              class="w-full mt-3 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm placeholder-slate-400" 
              placeholder="Ketik jawabanmu di sini..."></textarea>
          `;
        } else if (q.type === 'radio') {
          inputHtml = `
            <div class="space-y-2 mt-3.5">
              ${q.options.map((opt, idx) => `
                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer text-sm text-slate-700 transition">
                  <input type="radio" name="q_${q.no}" value="${opt.label}" ${q.required && idx === 0 ? 'required' : ''}
                    onchange="handleParentRadioChange('${q.no}', '${opt.label.replace(/'/g, "\\'")}', ${opt.hasOther})" 
                    class="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                  <span class="flex-1">${opt.label}</span>
                </label>
              `).join('')}
              <div id="other-input-${q.no}" class="hidden mt-2">
                <input type="text" id="other-val-${q.no}" placeholder="Sebutkan di sini..." 
                  class="w-full px-4 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
            </div>
            <!-- Wadah Follow-Up (11b, 12b, 13b) -->
            <div id="followup-container-${q.no}" class="mt-4 hidden slide-in"></div>
          `;
        } else if (q.type === 'checkbox') {
          inputHtml = `
            <div class="space-y-2 mt-3.5">
              ${q.options.map((opt) => `
                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer text-sm text-slate-700 transition">
                  <input type="checkbox" name="q_${q.no}" value="${opt.label}" 
                    onchange="handleCheckboxChange('${q.no}',${opt.hasOther}, this)"
                    class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500" />
                  <span class="flex-1">${opt.label}</span>
                </label>
              `).join('')}
              <div id="other-input-${q.no}" class="hidden mt-2">
                <input type="text" id="other-val-${q.no}" placeholder="Sebutkan di sini..." 
                  class="w-full px-4 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="text-sm font-semibold text-slate-800 leading-snug">
            <span class="text-blue-600 mr-1">${q.no}.</span> ${q.text} ${reqBadge}
          </div>
          ${inputHtml}
        `;

        container.appendChild(card);
      });
    }

    // Handler ketika opsi Radio pada soal induk dipilih
    function handleParentRadioChange(parentNo, selectedValue, hasOther) {
      // Toggle input isian tambahan "Lainnya"
      const otherContainer = document.getElementById(`other-input-${parentNo}`);
      if (otherContainer) {
        if (hasOther) {
          otherContainer.classList.remove('hidden');
        } else {
          otherContainer.classList.add('hidden');
          const input = document.getElementById(`other-val-${parentNo}`);
          if (input) input.value = '';
        }
      }

      // Render pertanyaan lanjutan jika ada follow-up template
      const followupContainer = document.getElementById(`followup-container-${parentNo}`);
      if (!followupContainer) return;

      const template = followupsData[String(parentNo).trim()];
      if (!template) {
        followupContainer.classList.add('hidden');
        followupContainer.innerHTML = '';
        return;
      }

      // Format teks pertanyaan follow-up
      let qText = template.text.replace(/\{pilihan\}/gi, selectedValue);
      const reqBadge = template.required 
        ? '<span class="text-rose-500 font-bold ml-0.5">*</span>' 
        : '<span class="text-slate-400 text-xs font-normal ml-1">(opsional)</span>';

      followupContainer.innerHTML = `
        <div class="p-4 bg-slate-50/90 rounded-xl border border-slate-200/90">
          <div class="text-xs font-bold text-slate-700 uppercase tracking-wide mb-2 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-blue-600"></span> Pertanyaan Lanjutan
          </div>
          <p class="text-sm font-semibold text-slate-800 mb-3">${qText} ${reqBadge}</p>
          <div class="space-y-2">
            ${template.options.map((opt, idx) => `
              <label class="flex items-center gap-3 p-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-sm text-slate-700">
                <input type="radio" name="followup_${parentNo}" value="${opt.label}" ${template.required && idx === 0 ? 'required' : ''}
                  data-parent-val="${selectedValue.replace(/"/g, '&quot;')}"
                  class="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                <span>${opt.label}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `;
      followupContainer.classList.remove('hidden');
    }

    function handleCheckboxChange(parentNo, hasOther, el) {
      const otherContainer = document.getElementById(`other-input-${parentNo}`);
      if (hasOther && otherContainer) {
        if (el.checked) {
          otherContainer.classList.remove('hidden');
        } else {
          otherContainer.classList.add('hidden');
          const input = document.getElementById(`other-val-${parentNo}`);
          if (input) input.value = '';
        }
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>Menyimpan Jawaban...</span>
      `;

      const answers = {};
      const labels = {};

      questionsData.forEach((q) => {
        const key = String(q.no);
        labels[key] = `${q.no}. ${q.text}`;

        if (q.type === 'text' || q.type === 'tel' || q.type === 'textarea') {
          const input = document.querySelector(`[name="q_${key}"]`);
          answers[key] = input ? input.value.trim() : '';
        } else if (q.type === 'radio') {
          const checked = document.querySelector(`[name="q_${key}"]:checked`);
          let val = checked ? checked.value : '';
          const otherInput = document.getElementById(`other-val-${key}`);
          if (otherInput && otherInput.value.trim()) {
            val += ` (${otherInput.value.trim()})`;
          }
          answers[key] = val;

          // Ambil jawaban follow-up jika terisi
          const followupChecked = document.querySelector(`[name="followup_${key}"]:checked`);
          if (followupChecked) {
            const template = followupsData[key];
            const followupKey = `${key}|${followupChecked.getAttribute('data-parent-val')}`;
            const followupNo = template.no || `${key}b`;
            
            answers[followupKey] = followupChecked.value;
            labels[followupKey] = `${followupNo}. ${template.text}`;
          }
        } else if (q.type === 'checkbox') {
          const checked = Array.from(document.querySelectorAll(`[name="q_${key}"]:checked`)).map(c => c.value);
          const otherInput = document.getElementById(`other-val-${key}`);
          if (otherInput && otherInput.value.trim()) {
            checked.push(`Lainnya: ${otherInput.value.trim()}`);
          }
          answers[key] = checked;
        }
      });

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers, labels })
        });

        document.getElementById('tracerForm').classList.add('hidden');
        document.getElementById('successModal').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        alert('Terjadi kesalahan saat mengirim jawaban. Silakan coba lagi.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Kirim Jawaban</span>';
      }
    }
  </script>
</body>
</html>
